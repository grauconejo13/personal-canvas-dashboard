<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Personal Canvas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Gridstack CSS -->
    <link href="https://cdn.jsdelivr.net/npm/gridstack@10.1.1/dist/gridstack.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="styles.css" />
</head>

<body>

    <header>
        <h1
            id="dashboard-title"
            contenteditable="true"
            spellcheck="false"
            role="textbox"
            aria-label="Dashboard title"
            aria-multiline="false"
            title="Click to rename (max 32 characters)">
            Canvas
        </h1>

        <div class="controls" role="toolbar" aria-label="Dashboard controls">
            <div class="group primary" aria-label="Add widgets">
                <button type="button" onclick="addTextWidget()" aria-label="Add text widget">＋ Add</button>
                <button type="button" onclick="addChecklistWidget()" aria-label="Add checklist widget">☑︎ List</button>
            </div>

            <div class="group themes" aria-label="Choose dashboard theme">
                <button type="button" onclick="setTheme('dark')" title="Dark theme" aria-label="Use dark theme">🌙</button>
                <button type="button" onclick="setTheme('light')" title="Light theme" aria-label="Use light theme">☀️</button>
                <button type="button" onclick="setTheme('minimal')" title="Minimal theme" aria-label="Use minimal theme">—</button>
            </div>

            <div class="group danger">
                <button type="button" onclick="resetDashboard()" aria-label="Reset dashboard">Reset</button>
            </div>
        </div>
    </header>

    <main aria-label="Personal canvas workspace">
        <div class="grid-stack"></div>
    </main>

    <!-- Gridstack JS -->
    <script src="https://cdn.jsdelivr.net/npm/gridstack@10.1.1/dist/gridstack-all.js"></script>
    <script src="app.js"></script>

</body>

</html>
